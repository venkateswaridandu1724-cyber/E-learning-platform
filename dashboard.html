<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f4f4f4;
        }

        /* Navbar */
        .navbar {
            background: #007BFF;
            padding: 15px;
            text-align: center;
        }

        .navbar a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }

        /* Container */
        .container {
            width: 80%;
            margin: auto;
            margin-top: 30px;
        }

        /* Cards */
        .card {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .btn {
            padding: 10px 15px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<div class="navbar">
    <a href="/">Home</a>
    <a href="/courses">Courses</a>
    <a href="/quiz">Quiz</a>
    <a href="/dashboard">Dashboard</a>
</div>

<div class="container">

<div class="card">
<h2>👤 Welcome</h2>
<p>Welcome {{ user }} 👋</p>
</div>

<div class="card">
<h2>📊 Quiz Score</h2>
<p>{{ score }}/10</p>
</div>

<div class="card">
<h2>📚 Completed Course</h2>
<p>{{ course }}</p>
</div>

<div class="card">
<h2>🤖 Recommended Course</h2>
<p>{{ recommendation }}</p>
</div>

<div class="card">
<h2>🚀 Quick Actions</h2>
<button class="btn" onclick="window.location.href='/courses'">Go to Courses</button>
<button class="btn" onclick="window.location.href='/quiz'">Take Quiz</button>
</div>

</div>

</body>
</html>
